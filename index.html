<!-- ===== Общие SVG-заготовки: лист и крест ===== -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <!-- Лист: растёт из точки (0,0) вправо по оси X.
         Цвет и толщину контура задаёт <use> через наследование. -->
    <g id="leaf">
      <path d="M0 0 C 18 -21 52 -25 76 0 C 52 25 18 21 0 0 Z"/>
      <path d="M3 0 H 68" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M20 -2 L 32 -13 M20 2 L 32 13 M36 -2 L 48 -13 M36 2 L 48 13 M52 0 L 60 -8 M52 0 L 60 8"
            fill="none" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Крест (латинский, с заострённым низом) -->
    <path id="cross-shape" d="M18 0 H30 V16 H46 V28 H30 V58 L24 68 L18 58 V28 H2 V16 H18 Z"/>
  </defs>
</svg>

  <use class="leaf"             href="#leaf" transform="translate(114 450) rotate(196) scale(0.9)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 570) rotate(-34) scale(0.78)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 690) rotate(212) scale(0.72)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 810) rotate(-22) scale(0.9)"/>
  <use class="leaf"             href="#leaf" transform="translate(114 930) rotate(200) scale(0.8)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 1050) rotate(-30) scale(0.72)"/>

<!-- ===== Центр: череп + вращающиеся кресты ===== -->
<!-- ============================================================
     Музыкальная плашка (SoundCloud)

<aside class="music">
  <p class="music__caption">А пока можете послушать этот шедевр</p>

  <div class="player">
    <button class="player__btn" id="playerBtn" type="button" aria-label="Воспроизвести">
      <svg class="player__icon player__icon--play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5 L19 12 L8 19 Z"/>
      </svg>
      <svg class="player__icon player__icon--stop" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10"/>
      </svg>
    </button>

    <div class="player__body">
      <div class="player__bar"><span class="player__fill" id="playerFill"></span></div>
      <p class="player__time"><span id="playerCur">0:00</span> / <span id="playerDur">--:--</span></p>
    </div>
  </div>

  <p class="music__credit">
    <a href="https://soundcloud.com/user-253695668" target="_blank" rel="noopener">Yukth</a>
    ·
    <a href="https://soundcloud.com/user-253695668/lobotomy-corporation-ost-emergency2" target="_blank" rel="noopener">Lobotomy Corporation |OST| Emergency2</a>
  </p>

  <!-- сам виджет SoundCloud: вынесен за экран, работает как источник звука -->
  <div class="player__source" aria-hidden="true">
    <iframe id="scPlayer"
            title="SoundCloud"
            scrolling="no"
            allow="autoplay; encrypted-media"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A508272441&amp;color=%230f0605&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false"></iframe>
  </div>

  <use class="leaf"             href="#leaf" transform="translate(112 210) rotate(206) scale(0.8)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 330) rotate(-18) scale(0.7)"/>
  <use class="leaf"             href="#leaf" transform="translate(114 450) rotate(196) scale(0.9)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 570) rotate(-34) scale(0.78)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 690) rotate(212) scale(0.72)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 810) rotate(-22) scale(0.9)"/>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {
  var frame = document.getElementById('scPlayer');
  var btn   = document.getElementById('playerBtn');
  var fill  = document.getElementById('playerFill');
  var cur   = document.getElementById('playerCur');
  var dur   = document.getElementById('playerDur');

  if (!frame || !btn) { return; }
  if (typeof SC === 'undefined') {
    btn.disabled = true;
    btn.setAttribute('aria-label', 'Плеер недоступен');
    return;
  }

  var widget  = SC.Widget(frame);
  var total   = 0;
  var playing = false;

  function time(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function paint(pos) {
    cur.textContent = time(pos);
    fill.style.width = total > 0 ? (Math.min(pos / total, 1) * 100) + '%' : '0%';
  }

  function setPlaying(state) {
    playing = state;
    btn.classList.toggle('is-playing', state);
    btn.setAttribute('aria-label', state ? 'Остановить' : 'Воспроизвести');
  }

  function readDuration() {
    widget.getDuration(function (ms) {
      total = ms || 0;
      if (total > 0) { dur.textContent = time(total); }
    });
  }

  widget.bind(SC.Widget.Events.READY, readDuration);
  widget.bind(SC.Widget.Events.PLAY, function () { setPlaying(true); });
  widget.bind(SC.Widget.Events.PAUSE, function () { setPlaying(false); });
  widget.bind(SC.Widget.Events.FINISH, function () { setPlaying(false); paint(0); });

  widget.bind(SC.Widget.Events.PLAY_PROGRESS, function (e) {
    if (!total) { readDuration(); }
    paint(e.currentPosition);
  });

  btn.addEventListener('click', function () {
    if (playing) { widget.pause(); } else { widget.play(); }
  });
})();
</script>

</body>
